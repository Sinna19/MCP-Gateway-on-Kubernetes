# VPS k3s (single node). Both domain and TLS come from here; ADR 024.
global:
  # The one line to change for a real domain.
  domain: 20.197.63.44.sslip.io
  storageClass: local-path
  ingress:
    className: traefik
    # Drives https URLs (WP_HOME), ingress tls blocks and COOKIE_SECURE=true.
    tls: true
    # Staging first; change to letsencrypt-prod once staging issues.
    clusterIssuer: letsencrypt-staging
    redirectHttps: true
certManager:
  # cert-manager is installed on the VPS as its own release, so the CRDs exist there.
  clusterIssuers: true
store:
  wordpress:
    # Application Passwords need this plus the mu-plugin (in-cluster HTTP); proven on k3d first.
    environmentType: production
gateway:
  llm:
    baseUrl: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
