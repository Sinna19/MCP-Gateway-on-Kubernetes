# VPS k3s. Replace the domain with the real one once DNS exists (see ADR 001).
global:
  domain: example.com
  storageClass: local-path
  ingress:
    className: traefik
    tls: false
# Application Passwords need HTTPS unless WP_ENVIRONMENT_TYPE is "local". Prod stays on "local"
# (the chart default) while global.ingress.tls is false; set store.wordpress.environmentType to
# "production" here once TLS is on.
