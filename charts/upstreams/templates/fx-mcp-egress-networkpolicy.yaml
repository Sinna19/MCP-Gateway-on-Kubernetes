{{- if .Values.fx }}
# fx-mcp serves built-in rates and calls nobody; DNS is all it may use. Ingress is in fx-mcp-networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fx-mcp-egress
  labels:
    app.kubernetes.io/name: fx-mcp
    {{- include "upstreams.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fx-mcp
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.network.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.global.network.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
