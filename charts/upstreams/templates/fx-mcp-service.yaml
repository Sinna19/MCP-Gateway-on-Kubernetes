{{- if .Values.fx }}
apiVersion: v1
kind: Service
metadata:
  name: fx-mcp
  labels:
    app.kubernetes.io/name: fx-mcp
    {{- include "upstreams.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fx-mcp
  ports:
    - name: http
      port: {{ .Values.fx.port }}
      targetPort: http
{{- end }}
