image:
  repository: urumi/gateway
  # Must be set. `make deploy` passes the tree hash of services/gateway.
  tag: ""

port: 8080

# Ingress host is <ingress.host>.<global.domain>. Only these paths are routed to the gateway; the dashboard chart owns "/".
ingress:
  host: app
  paths:
    - /mcp
    - /api

# Secrets created by scripts/secrets.sh. Keys: gateway-db/password, gateway-app/{credentials-key,admin-email,admin-password}.
dbSecret: gateway-db
appSecret: gateway-app

# Chat agent. Chat answers 503 "chat not configured" until baseUrl, model and the Secret key are all set.
# The key lives only in Secret llm-api (key api-key), created by scripts/secrets.sh from $LLM_API_KEY.
llm:
  baseUrl: ""
  model: ""
  secret: llm-api

# Tools chat may run without asking the user first. Everything else needs a confirm click.
chat:
  readOnlyTools:
    - woo__list_products
    - woo__list_orders
    - woo__get_order
    - fx__convert_currency
    - fx__list_rates
    - notes__list_notes
    - notes__list_products

# Rate limits (ADR 020). In memory, so per pod: right for one replica, reset on restart. Over the limit gives 429 + Retry-After.
# mcp.callsPerMinute must stay well above scripts/dod-check.sh (12 calls on its busiest key).
limits:
  login:
    perEmail: 5 # attempts per email per window, wrong or right
    perIp: 30 # per client IP; successful logins give theirs back
    windowSeconds: 900
  mcp:
    callsPerMinute: 60 # tools/call per API key

# First upstream registered on first start (in-cluster woo-mcp Service).
seedWooUrl: http://woo-mcp:3000/mcp

# Port every upstream MCP server listens on (container port). Must equal woo-mcp.port and upstreams.*.port:
# subcharts cannot read each other's values.
networkPolicy:
  upstreamPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

postgres:
  image: postgres:17.6-alpine
  database: gateway
  user: gateway
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
