apiVersion: v1
kind: Service
metadata:
  name: gateway-postgres
  labels:
    app.kubernetes.io/name: gateway-postgres
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
