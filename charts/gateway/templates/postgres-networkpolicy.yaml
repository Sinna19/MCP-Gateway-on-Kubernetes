# The database holds users, key hashes and encrypted upstream credentials, so only gateway pods (and the rotation Job) may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-postgres-allow-gateway
  labels:
    app.kubernetes.io/name: gateway-postgres
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        # The key-rotation Job (ADR 023).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-rotate-key
      ports:
        - port: 5432
          protocol: TCP
