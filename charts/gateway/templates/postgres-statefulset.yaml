# Postgres pods are labelled gateway-postgres, never gateway, so the gateway's Service, Deployment and
# the NetworkPolicies cannot select them by accident.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway-postgres
  labels:
    app.kubernetes.io/name: gateway-postgres
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  serviceName: gateway-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-postgres
        {{- include "gateway.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret }}
                  key: password
            # The volume root can hold lost+found; initdb needs an empty subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # startupProbe gives first-time initdb room; the other two start after it passes.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # The image writes its unix socket under /var/run/postgresql, which is root-owned in the image.
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
