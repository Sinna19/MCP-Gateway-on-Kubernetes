# store subchart values. global.* comes from the umbrella chart (deploy/values-*.yaml).
mariadb:
  image: mariadb:11.4.13
  database: wordpress
  user: wordpress
  # Secret is created by scripts/secrets.sh, never by Helm (ADR 002).
  # Keys: root-password, password.
  existingSecret: store-db
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

wordpress:
  # Pinned to the exact patch version (latest on Docker Hub, 2026-10-15). The setup Job's WP-CLI
  # image must match this core version (ADR 003).
  image: wordpress:7.1.3-php8.3-apache
  # Public host is <host>.<global.domain>, e.g. shop.localtest.me.
  host: shop
  # Created by scripts/secrets.sh. Keys: auth-key, secure-auth-key, logged-in-key, nonce-key,
  # auth-salt, secure-auth-salt, logged-in-salt, nonce-salt.
  existingSaltsSecret: store-wp-salts
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi
  # "local" lets Application Passwords work over plain HTTP. deploy/values-prod.yaml sets "production".
  environmentType: local
  # Created by scripts/secrets.sh. Keys: username, password.
  existingAdminSecret: store-wp-admin

setup:
  # Only provides the wp binary. Core comes from wordpress.image, so the version always matches (ADR 003).
  cliImage: wordpress:cli-2.12.0-php8.3
  woocommerceVersion: "11.2.1"
  siteTitle: Urumi Store
  adminEmail: admin@example.com
  # Created empty by scripts/secrets.sh (key username); the Job adds key password.
  apiSecret: woo-api
  integrationUser: woo-mcp
  # Names must not contain "|": the setup script reads each product as a "sku|price|name" line.
  products:
    - { name: "Classic T-Shirt", sku: "TSHIRT-001", price: "19.99" }
    - { name: "Coffee Mug", sku: "MUG-001", price: "9.50" }
    - { name: "Canvas Tote Bag", sku: "TOTE-001", price: "14.00" }
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi
