apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-wordpress
  labels:
    app.kubernetes.io/name: wordpress
    {{- include "store.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The wp-content PVC is ReadWriteOnce, so the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      annotations:
        checksum/mu-plugin: {{ include (print $.Template.BasePath "/mu-plugin-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: wordpress
        {{- include "store.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 33
        seccompProfile:
          type: RuntimeDefault
        runAsGroup: 33
        runAsNonRoot: true
        fsGroup: 33
        # Lets apache (non-root) bind port 80.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      initContainers:
        # The image entrypoint copies core with tar, which fails when not root (it tries to chmod the
        # mount root, exit 2). cp does not. -n keeps files already on the wp-content PVC.
        - name: copy-core
          image: {{ .Values.wordpress.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c", "cp -rn /usr/src/wordpress/. /var/www/html/"]
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: core
              mountPath: /var/www/html
            - name: content
              mountPath: /var/www/html/wp-content
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /license.txt
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # Static file: a database outage must not restart WordPress.
          livenessProbe:
            httpGet:
              path: /license.txt
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          # Goes through PHP and the database. The redirect to install.php before setup counts as ready.
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: core
              mountPath: /var/www/html
            - name: content
              mountPath: /var/www/html/wp-content
            - name: mu-plugin
              mountPath: /var/www/html/wp-content/mu-plugins/app-passwords.php
              subPath: app-passwords.php
      volumes:
        # WordPress core is copied from the image on every start; only wp-content is persistent.
        - name: core
          emptyDir: {}
        - name: content
          persistentVolumeClaim:
            claimName: store-wordpress-content
        - name: mu-plugin
          configMap:
            name: store-mu-plugin
