# Plain Job, not a Helm hook. The name carries the release revision because Job specs are immutable.
# The script is idempotent, so every helm upgrade can run it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: setup
    {{- include "store.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      annotations:
        checksum/mu-plugin: {{ include (print $.Template.BasePath "/mu-plugin-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: setup
        {{- include "store.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: store-setup
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        fsGroup: 33
      initContainers:
        # Same core copy as the WordPress pod, from the same image, so the version always matches.
        # "/usr/src/wordpress/." (not a * glob) also copies dotfiles. wp-config-docker.php reads its
        # settings from the WORDPRESS_* env vars at runtime, so a plain copy is enough.
        - name: copy-core
          image: {{ .Values.wordpress.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c", "cp -rn /usr/src/wordpress/. /var/www/html/ && cp -n /usr/src/wordpress/wp-config-docker.php /var/www/html/wp-config.php"]
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          volumeMounts:
            - name: core
              mountPath: /var/www/html
            - name: content
              mountPath: /var/www/html/wp-content
      containers:
        - name: setup
          image: {{ .Values.setup.cliImage }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command: ["bash", "/setup/setup.sh"]
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
            - name: SITE_URL
              value: {{ include "store.url" . | quote }}
            - name: SITE_TITLE
              value: {{ .Values.setup.siteTitle | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.setup.adminEmail | quote }}
            - name: WC_VERSION
              value: {{ .Values.setup.woocommerceVersion | quote }}
            - name: INTEGRATION_USER
              value: {{ .Values.setup.integrationUser | quote }}
            - name: API_SECRET
              value: {{ .Values.setup.apiSecret | quote }}
            - name: PRODUCTS_FILE
              value: /setup/products.txt
            - name: WC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wordpress.existingAdminSecret }}
                  key: username
            - name: WC_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wordpress.existingAdminSecret }}
                  key: password
            - name: HOME
              value: /tmp
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          volumeMounts:
            - name: core
              mountPath: /var/www/html
            - name: content
              mountPath: /var/www/html/wp-content
            - name: setup
              mountPath: /setup
            - name: mu-plugin
              mountPath: /var/www/html/wp-content/mu-plugins/app-passwords.php
              subPath: app-passwords.php
      volumes:
        - name: mu-plugin
          configMap:
            name: store-mu-plugin
        - name: core
          emptyDir: {}
        - name: content
          persistentVolumeClaim:
            claimName: store-wordpress-content
        - name: setup
          configMap:
            name: store-setup
