apiVersion: v1
kind: ConfigMap
metadata:
  name: store-setup
  labels:
    app.kubernetes.io/name: setup
    {{- include "store.labels" . | nindent 4 }}
data:
  setup.sh: |
    {{- .Files.Get "files/setup.sh" | nindent 4 }}
  products.txt: |
    {{- range .Values.setup.products }}
    {{ .sku }}|{{ .price }}|{{ .name }}
    {{- end }}
