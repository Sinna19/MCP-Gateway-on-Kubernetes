apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    app.kubernetes.io/name: woo-mcp
    {{- include "woo-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woo-mcp
        {{- include "woo-mcp.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: woo-api
          secret:
            secretName: {{ .Values.existingSecret }}
            # Only the password. The pod waits in ContainerCreating until the setup Job adds this key.
            items:
              - key: password
                path: password
      containers:
        - name: woo-mcp
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set; use make deploy" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: WOO_URL
              value: {{ .Values.wooUrl | quote }}
            - name: WOO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: username
            # A file, not an env var: kubelet updates it in place when the setup Job regenerates the password.
            - name: WOO_APP_PASSWORD_FILE
              value: /var/run/secrets/woo/password
            # Rotating this one needs a rollout restart (ADR 021).
            - name: WOO_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokenSecret }}
                  key: token
          volumeMounts:
            # No subPath: kubelet does not update subPath mounts.
            - name: woo-api
              mountPath: /var/run/secrets/woo
              readOnly: true
          # The process is up. Does not depend on WordPress, so a store outage never restarts us.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          # Calls WooCommerce with our credentials, so we leave the Service until the store answers.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 12
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
