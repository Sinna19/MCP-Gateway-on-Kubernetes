image:
  repository: urumi/woo-mcp
  # Must be set. `make deploy` passes the tree hash of services/woo-mcp.
  tag: ""

port: 3000

# In-cluster URL of the store Service. Plain HTTP is fine inside the cluster.
wooUrl: http://store-wordpress

# Secret created by scripts/secrets.sh (username) and the store setup Job (password). Keys: username, password.
existingSecret: woo-api

# Secret created by scripts/secrets.sh. Key: token. The gateway sends it as a bearer token (set by `make register`).
tokenSecret: woo-mcp-token

# Pods allowed to reach woo-mcp. Only the gateway.
allowedClientLabel:
  app.kubernetes.io/name: gateway

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi
