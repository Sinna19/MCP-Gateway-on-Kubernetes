server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/security-headers.conf;

  # Unknown paths (/servers, /invite/<token>) are client routes: serve the app and let React Router decide.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed build files. A missing one must be a real 404, not index.html served as text/html.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    include /etc/nginx/security-headers.conf;
    default_type text/plain;
    return 200 "ok";
  }
}
